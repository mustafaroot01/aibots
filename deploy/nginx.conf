# ═══════════════════════════════════════════════════════════
#  إعداد nginx للموقع
#
#  • nginx عادي (بدون Plesk): استخدم الملف كامل بـ sites-available
#  • Plesk: انسخ محتوى الكتلة الثانية بس (location ~ ^/) لخانة
#    «Additional nginx directives» — Plesk يعرّف location / بنفسه
#    فما ينفع تكرره، والتعبير النمطي ~ ^/ يسبقه بالأولوية
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name jobs.example.com;   # غيّر للدومين مالك

    # certbot راح يضيف إعدادات SSL هنا تلقائياً

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}

